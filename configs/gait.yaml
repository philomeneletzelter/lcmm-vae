dataset:
  data_path: "./data/gait/"
  batch_size: 512
  heldout_fraction: 0  # already separated
  covariates:
    n_basis: 12
    terms:
      - {block: "fixed", transform: "bspline"}

model:
  n_clusters: 3
  latent_dim: 6
  encoder_hidden_dims: [512, 256]
  decoder_hidden_dims: [256, 512]
  vy_init: 1.0              # initial sigma_y^2
  sigma_eps2: 1.0           # latent residual variance (fixed)
  d_init: 1.0               # D_l = d_init · I
  min_D_diag: 0.001         # numerical jitter 
  init_ridge: 0.001
  init_tries: 50            # em-EM runs
  posterior: meanfield      # or structured
  estep_sweeps: 1           # mean-field E-step sweeps per epoch
  estep_sweeps_infer: 20    # at inference

pretraining:
  epochs: 20
  kl_annealing_epochs: 20
  lr: 0.001

training:
  seed: 0
  epochs: 50                # maximum
  tol: 0.001                # stop when fewer subjects change class
  lr: 0.001
