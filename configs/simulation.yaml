dataset:
  data_path: null           # set by experiments.simulation.run
  batch_size: 512
  heldout_fraction: 0.15
  covariates:
    n_basis: 6
    terms:
      - {block: "fixed", transform: "bspline"}
      - {block: "random", transform: "intercept_slope"}

model:
  n_clusters: 3
  latent_dim: 3
  encoder_hidden_dims: [256, 128]
  decoder_hidden_dims: [128, 256]
  vy_init: 1.0              # initial sigma_y^2
  sigma_eps2: 1.0           # latent residual variance (fixed)
  d_init: 1.0
  min_D_diag: 0.001
  init_ridge: 0.001
  init_tries: 50            # em-EM runs
  posterior: meanfield      # or structured
  estep_sweeps: 1           # mean-field E-step sweeps per epoch
  estep_sweeps_infer: 20    # at inference

pretraining:
  epochs: 10
  kl_annealing_epochs: 10
  lr: 0.001

training:
  seed: 0
  epochs: 50                # maximum
  tol: 0.001                # stop when fewer subjects change class
  lr: 0.001
